name: Publish to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # No registry-url: it would make setup-node write an .npmrc with a
      # placeholder _authToken, and npm would use that (invalid) token instead
      # of OIDC. With no token configured, npm uses trusted publishing.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.x.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Trusted publishing authenticates via OIDC and generates provenance
      # automatically — no token and no --provenance flag required.
      - name: Publish to npm
        run: npm publish --access public
