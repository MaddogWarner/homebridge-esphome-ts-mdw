name: Publish to npm

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # registry-url is required so npm runs the OIDC trusted-publishing
      # handshake. setup-node then writes an .npmrc with a placeholder
      # _authToken; npm would use that bogus token instead of OIDC, so the next
      # step strips it (see actions/setup-node#1440).
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.x.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Remove placeholder auth token so npm uses OIDC
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d; /always-auth/d' "$npmrc"
          echo "Effective .npmrc:"; cat "$npmrc"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Trusted publishing authenticates via OIDC and generates provenance
      # automatically — no token and no --provenance flag required.
      - name: Publish to npm
        run: npm publish --access public
